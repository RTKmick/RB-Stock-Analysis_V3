<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB 籌碼戰情室 - 靜態 Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    .led-pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:#1e1e1e; border:1px solid #3a3a3a; color:#cfcfcf; font-weight:700; font-size:0.95rem; }
    .led-pill.off{ opacity:.55; }
    .led-pill.off .led-dot{ background:#555; }
    .led-dot{ width:10px; height:10px; border-radius:50%; background:#666; }
    .led-pill.on .led-dot{ background:#22c55e; box-shadow:0 0 10px rgba(34,197,94,.9); }
    .led-pill.danger .led-dot{ background:#ef4444; box-shadow:0 0 10px rgba(239,68,68,.9); }
    .led-pill.warn .led-dot{ background:#eab308; box-shadow:0 0 10px rgba(234,179,8,.9); }
    .led-group{ display:flex; flex-wrap:wrap; gap:10px; }
    .broker-chip{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
    body{ background:#0c0c0c; color:#e0e0e0; font-family:'Segoe UI',Microsoft JhengHei,sans-serif; }
    .card{ background:#1a1a1a; border:1px solid #333; margin-bottom:20px; border-radius:12px; }
    .status-pass{ color:#2ecc71; font-weight:bold; }
    .status-fail{ color:#e74c3c; font-weight:bold; }
    .status-warn{ color:#f1c40f; font-weight:bold; }
    .update-time{ font-size:0.85em; color:#888; }
    .table-dark{ --bs-table-bg:#1a1a1a; font-size:0.85em; }
    .table-dark th{ color:#f1c40f; }
    .buy-row{ color:#ff4444; font-weight:bold; }
    .sell-row{ color:#66b2ff; font-weight:bold; }
    .metric-card{ text-align:center; padding:15px; border-radius:8px; background:#252525; }
    .metric-value{ font-size:1.8rem; font-weight:bold; color:#f1c40f; }
    .metric-label{ font-size:0.8rem; color:#aaa; }
    .tag-pill{ display:inline-block; padding:4px 10px; border-radius:999px; background:#2b2b2b; color:#ddd; font-size:0.8rem; margin-right:6px; margin-top:6px; border:1px solid #444; }
    .chart-container{ position:relative; height:350px; width:100%; margin-bottom:20px; }
    .chart-container-bar{ position:relative; height:420px; width:100%; margin-bottom:20px; }
    .chart-container-mini{ position:relative; height:240px; width:100%; margin-bottom:20px; }
    .cost-zone-container{ background:#0f0f0f; border-radius:8px; padding:15px; border-left:4px solid #f1c40f; margin-bottom:20px; }
    .cost-bar-track{ position:relative; height:6px; background:#333; border-radius:4px; margin-top:6px; }
    .cost-bar-range{ position:absolute; top:0; height:6px; background:linear-gradient(90deg,#f97316,#22c55e); border-radius:4px; }
    .cost-bar-close{ position:absolute; top:-3px; width:2px; height:12px; background:#e5e7eb; }
    .cost-bar-label{ font-size:0.8rem; color:#f9fafb; margin-top:4px; }
    .kpi-hero{ padding:16px; border-radius:10px; border:1px solid #333; text-align:center; }
    .kpi-hero .kpi-title{ font-size:0.85rem; color:#aaa; }
    .kpi-hero .kpi-num{ font-size:1.8rem; font-weight:bold; }
    .kpi-hero.pos .kpi-num{ color:#2ecc71; }
    .kpi-hero.neg .kpi-num{ color:#e74c3c; }
    .kpi-hero .kpi-sub{ font-size:0.8rem; color:#888; }
    .text-info-dash{ color:#5bc0de; }
    .dashboard-subtitle{ color:#9ca3af; font-size:0.95rem; }
    .org-foreign{ color:#c084fc; font-weight:600; }
    .org-local{ color:#84cc16; font-weight:600; }
    .page-title{ color:#f1c40f; }
    .stock-search-input{ max-width:180px; font-size:1rem; }
    .stock-select-input{ max-width:240px; font-size:1rem; }
    .report-iframe{ width:100%; height:80vh; border:none; margin-top:16px; }
    .report-iframe-phase3{ margin-top:12px; }
    .phase3-hint{ font-size:0.9rem; }
    .phase3-error{ display:none; margin-top:12px; padding:1rem 1.25rem; border-radius:8px;
      background:#2a1515; border:1px solid #7f1d1d; color:#fecaca; }
    .phase3-error.show{ display:block; }
    .nav-link-ext .tab-ext-icon{ font-size:0.85em; opacity:0.85; margin-left:2px; }
    .market-bar {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .market-kpi { text-align: center; min-width: 120px; }
    .market-kpi .mk-label { font-size: 0.72rem; color: #9ca3af; margin-bottom: 2px; }
    .market-kpi .mk-value { font-size: 1.1rem; font-weight: 700; }
    .market-kpi .mk-sub { font-size: 0.7rem; color: #6b7280; }
    .market-state-badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .ms-risk-on   { background: #052e16; color: #22c55e; border: 1px solid #166534; }
    .ms-cautious  { background: #422006; color: #eab308; border: 1px solid #854d0e; }
    .ms-neutral   { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
    .ms-risk-off  { background: #2d0a0a; color: #ef4444; border: 1px solid #7f1d1d; }
    .stock-context-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 600;
    }
    .sct-follow  { background: #1e3a5f; color: #60a5fa; }
    .sct-diverge { background: #3b1f00; color: #fb923c; }
    .broker-spark-bar { display: inline-block; vertical-align: middle; margin-left: 8px; }
    .backtest-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 600;
    }
    .bt-good  { background: #052e16; color: #22c55e; border: 1px solid #166534; }
    .bt-neutral { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
    .bt-bad   { background: #2d0a0a; color: #ef4444; border: 1px solid #7f1d1d; }
    .bt-nodata { background: #1a1a1a; color: #6b7280; font-style: italic; }
    .metric-tip {
      cursor: help;
      border-bottom: 1px dotted #6b7280;
    }
    /* Phase 5：多股比較表 */
    .compare-panel {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .compare-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .compare-header h5 {
      margin: 0;
      color: #f1c40f;
      font-size: 1rem;
    }
    .compare-toggle {
      background: none;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .compare-toggle:hover { border-color: #9ca3af; color: #fff; }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .compare-table th {
      background: #1f2937;
      color: #9ca3af;
      padding: 8px 10px;
      text-align: center;
      border-bottom: 2px solid #374151;
      font-weight: 600;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .compare-table td {
      padding: 8px 10px;
      text-align: center;
      border-bottom: 1px solid #1f2937;
      color: #e5e7eb;
    }
    .compare-table tr:hover { background: #1a2332; }
    .compare-table tr.active-row { background: #172554; border-left: 3px solid #3b82f6; }
    .cmp-green { color: #22c55e; }
    .cmp-red { color: #ef4444; }
    .cmp-yellow { color: #eab308; }
    .cmp-gray { color: #6b7280; }
    .cmp-cell-good { background: rgba(34,197,94,0.1); }
    .cmp-cell-bad { background: rgba(239,68,68,0.1); }
    .cmp-clickable { cursor: pointer; }
    .cmp-clickable:hover { text-decoration: underline; color: #60a5fa; }
    /* Phase 5：條件警報 */
    .alert-banner {
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-danger {
      background: linear-gradient(90deg, #450a0a, #7f1d1d);
      color: #fca5a5;
      border: 1px solid #dc2626;
      animation: alertPulse 2s ease-in-out infinite;
    }
    .alert-warning {
      background: linear-gradient(90deg, #451a03, #78350f);
      color: #fde68a;
      border: 1px solid #d97706;
    }
    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .alert-dismiss {
      margin-left: auto;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.6;
    }
    .alert-dismiss:hover { opacity: 1; }
    /* Phase 7：對手盤面板 */
    .opponent-panel {
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .opponent-title {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .opponent-table {
      width: 100%;
      font-size: 0.82rem;
    }
    .opponent-table td {
      padding: 4px 8px;
      border-bottom: 1px solid #2d0a0a;
      color: #d1d5db;
    }
    .opponent-vs {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .opponent-vs > div {
      flex: 1;
      min-width: 280px;
    }
    /* Phase 9：跨股資金流向 */
    .crossflow-panel {
      background: #0c0a1a;
      border: 1px solid #4338ca;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
    }
    .crossflow-title {
      color: #a78bfa;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .crossflow-broker {
      padding: 8px 0;
      border-bottom: 1px solid #1e1b4b;
    }
    .crossflow-broker:last-child { border-bottom: none; }
    .rotation-tag {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <h1 class="mb-2 text-center page-title" id="dashboardTitle">📊 RUNBOR 籌碼戰情室</h1>

  <!-- 全域股票選擇器：所有分頁共用 -->

              class="report-iframe"

      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">

          <button type="button" class="btn btn-sm btn-outline-warning" data-phase3-horizon="5">ret_5d（警示燈）</button>
          <button type="button" class="btn btn-sm btn-outline-warning" data-phase3-horizon="10">ret_10d（輔助燈）</button>

        若顯示空白：請先在本機執行 <code>bat/7_phase3_ml_winrate.bat</code> 產生 <code>data/ml_winrate_report_ret*.html</code>，並推送到 GitHub Pages。

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  const DATA_BASE = 'data';
  /** 避免 GitHub Pages／瀏覽器快取導致 HTML 已更新但 JSON 仍舊，或反過來。 */
  function fetchNoStore(url) {
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    return fetch(url + sep + '_cb=' + Date.now(), { cache: 'no-store' });
  }
  var signalStats = null;
  const DEFAULT_STOCK = '2454';
  let manifest = { stock_ids: [], stocks: [] };
  var marketCtx = null;
  var allStockData = {};
  var compareStockOrder = [];
  let charts = { whale: null, radar: null, breadth: null, tornadoBuy: null, tornadoSell: null };

  function loadSignalStats() {
    return fetch(DATA_BASE + '/signal_stats.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) { signalStats = d; return d; })
      .catch(function() { signalStats = null; return null; });
  }
  function getBacktestBadge(actionSignal) {
    if (!actionSignal) return '';
    var minN = (signalStats && signalStats.min_sample_size) || 10;
    if (!signalStats || !signalStats.by_signal) {
      return '<span class="backtest-badge bt-nodata">累積數據中（0/' + minN + '筆）</span>';
    }
    var s = signalStats.by_signal[actionSignal];
    if (!s) {
      return '<span class="backtest-badge bt-nodata">累積數據中（0/' + minN + '筆）</span>';
    }
    var winRate = s.win_rate_10d != null ? s.win_rate_10d : s.win_rate_5d;
    var avgRet  = s.avg_return_10d_pct != null ? s.avg_return_10d_pct : s.avg_return_5d_pct;
    var period  = s.win_rate_10d != null ? '10日' : '5日';
    var sample  = s.win_rate_10d != null ? (s.sample_size_10d || 0) : (s.sample_size_5d || 0);
    if (winRate == null || sample < minN) {
      return '<span class="backtest-badge bt-nodata">累積數據中（' + (sample || 0) + '/' + minN + '筆）</span>';
    }
    var cls = winRate >= 0.6 ? 'bt-good' : (winRate <= 0.4 ? 'bt-bad' : 'bt-neutral');
    var pct = (winRate * 100).toFixed(0);
    var ret = (avgRet >= 0 ? '+' : '') + Number(avgRet).toFixed(1) + '%';
    return '<span class="backtest-badge ' + cls + '">歷史' + period + '勝率 ' + pct + '%｜平均 ' + ret + '（' + sample + '筆）</span>';
  }
  function loadMarketContext() {
    return fetch(DATA_BASE + '/market_context.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        marketCtx = d;
        renderMarketBar(d);
        return d;
      })
      .catch(function() {
        marketCtx = null;
      });
  }

  function renderMarketBar(ctx) {
    var host = document.getElementById('marketBar');
    if (!host || !ctx) return;
    var t = ctx.taiex || {};
    var inst = ctx.institutional || {};
    var ms = ctx.market_state || 'NEUTRAL';
    var msReason = ctx.market_state_reason || '';
    var msClass = {
      'RISK_ON': 'ms-risk-on',
      'CAUTIOUS': 'ms-cautious',
      'NEUTRAL': 'ms-neutral',
      'RISK_OFF': 'ms-risk-off'
    }[ms] || 'ms-neutral';
    var msText = {
      'RISK_ON': '🟢 多頭格局',
      'CAUTIOUS': '🟡 留意風險',
      'NEUTRAL': '⚫ 方向不明',
      'RISK_OFF': '🔴 偏空警戒'
    }[ms] || '⚫ 觀察中';
    var fRaw1d = inst.foreign_net_1d != null ? Number(inst.foreign_net_1d) : null;
    var fRaw5d = inst.foreign_net_5d != null ? Number(inst.foreign_net_5d) : null;
    var fNet1d = fRaw1d != null ? (fRaw1d / 100000000).toFixed(1) : '-';
    var fNet5d = fRaw5d != null ? (fRaw5d / 100000000).toFixed(1) : '-';
    var fStreak = inst.foreign_streak_sell || 0;
    var streakText = fStreak >= 2 ? '（連賣' + fStreak + '日）' : '';
    var changePct = t.change_pct != null ? t.change_pct : 0;
    var changeColor = changePct >= 0 ? '#22c55e' : '#ef4444';
    var changeSign = changePct >= 0 ? '+' : '';
    var closeFmt = t.close != null ? Number(t.close).toLocaleString('zh-TW', { maximumFractionDigits: 2 }) : '-';
    var html = '<div class="market-bar">';
    html += '<div><span class="market-state-badge ' + msClass + '">' + msText + '</span></div>';
    html += '<div class="market-kpi"><div class="mk-label">加權指數</div>';
    html += '<div class="mk-value" style="color:' + changeColor + ';">' + closeFmt + '</div>';
    html += '<div class="mk-sub">' + changeSign + changePct + '%</div></div>';
    html += '<div class="market-kpi"><div class="mk-label">外資今日</div>';
    html += '<div class="mk-value" style="color:' + ((fRaw1d != null && fRaw1d >= 0) ? '#22c55e' : '#ef4444') + ';">' + fNet1d + ' 億</div>';
    html += '<div class="mk-sub">' + streakText + '</div></div>';
    html += '<div class="market-kpi"><div class="mk-label">外資5日</div>';
    html += '<div class="mk-value" style="color:' + ((fRaw5d != null && fRaw5d >= 0) ? '#22c55e' : '#ef4444') + ';">' + fNet5d + ' 億</div></div>';
    var t20 = t.trend_20d_pct != null ? t.trend_20d_pct : 0;
    html += '<div class="market-kpi"><div class="mk-label">20日趨勢</div>';
    html += '<div class="mk-value" style="color:' + (t20 >= 0 ? '#22c55e' : '#ef4444') + ';">' + (t20 >= 0 ? '+' : '') + t20 + '%</div></div>';
    if (msReason) {
      html += '<div style="flex-basis:100%; font-size:0.78rem; color:#6b7280; margin-top:4px;">' + escapeHtml(msReason) + '</div>';
    }
    html += '</div>';
    host.innerHTML = html;
  }

  function getStockContextTag(stockSignals) {
    if (!marketCtx || !marketCtx.institutional) return '';
    var mktDir = marketCtx.institutional.foreign_net_5d > 0 ? 'BUY' : 'SELL';
    var stockDir = parseFloat(stockSignals.inst_foreign_net_5d || 0) > 0 ? 'BUY' : 'SELL';
    var same = mktDir === stockDir;

  function buildMomentumSpark(rolling5d, turnPoint, dates) {
    if (!rolling5d || rolling5d.length === 0) return '';
    var w = 200, h = 40, pad = 2;
    var pairs = [];
    for (var i = 0; i < rolling5d.length; i++) {
      var v = rolling5d[i];
      if (v !== null && v !== undefined && !isNaN(Number(v))) {
        pairs.push({ i: i, v: Number(v) });
      }
    }
    if (pairs.length < 2) return '';
    var vals = pairs.map(function(p) { return Math.abs(p.v); });
    var maxAbs = Math.max.apply(null, vals);
    if (!maxAbs || maxAbs === 0) maxAbs = 1;
    var mid = h / 2;
    var span = (dates && dates.length > 1) ? (dates.length - 1) : Math.max(1, pairs[pairs.length - 1].i);
    var points = [];
    for (var j = 0; j < pairs.length; j++) {
      var gi = pairs[j].i;
      var x = pad + (gi / span) * (w - 2 * pad);
      var y = mid - (pairs[j].v / maxAbs) * (mid - pad);
      points.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var svg = '<svg width="' + w + '" height="' + h + '" class="momentum-spark-svg" style="display:block;max-width:100%;">';
    svg += '<line x1="' + pad + '" y1="' + mid + '" x2="' + (w - pad) + '" y2="' + mid + '" stroke="#374151" stroke-width="0.5" />';
    svg += '<polyline points="' + points.join(' ') + '" fill="none" stroke="#60a5fa" stroke-width="1.5" />';
    if (turnPoint && dates && dates.length) {
      var tIdx = dates.indexOf(turnPoint);
      if (tIdx >= 0) {
        var tx = pad + (tIdx / span) * (w - 2 * pad);
        var tv = null;
        for (var k = 0; k < pairs.length; k++) {
          if (pairs[k].i === tIdx) { tv = pairs[k].v; break; }
        }
        if (tv != null) {
          var ty = mid - (tv / maxAbs) * (mid - pad);
          svg += '<circle cx="' + tx.toFixed(1) + '" cy="' + ty.toFixed(1) + '" r="3" fill="#f59e0b" stroke="#fff" stroke-width="0.5" />';
        }
      }
    }
    svg += '</svg>';
    return svg;
  }

    var badges = [];

  function buildBrokerBarSpark(dailySeries, whaleData, brokerName) {
    var series = dailySeries;
    if ((!series || series.length < 2) && whaleData) {
      var found = null;
      for (var i = 0; i < whaleData.length; i++) {
        if (whaleData[i].name === brokerName) {
          found = whaleData[i].values;
          break;
        }
      }
      if (found && found.length >= 2) {
        series = [found[0]];
        for (var j = 1; j < found.length; j++) {
          series.push(Math.round((found[j] - found[j - 1]) * 10) / 10);
        }
      }
    }
    if (!series || series.length < 2) return '';
    var W = 100, H = 28, PAD = 2;
    var n = series.length;
    var barW = Math.max(2, Math.floor((W - PAD * 2) / n) - 1);
    var gap = 1;
    var maxAbs = Math.max.apply(null, series.map(function(v) { return Math.abs(v); }));
    if (maxAbs === 0) maxAbs = 1;
    var midY = H / 2;
    var maxBarH = midY - PAD;
    var bars = '';
    for (var k = 0; k < n; k++) {
      var v = series[k];
      var barH = Math.max(1, Math.abs(v) / maxAbs * maxBarH);
      var x = PAD + k * (barW + gap);
      var y, color;
      if (v >= 0) {
        y = midY - barH;
        color = '#22c55e';
      } else {
        y = midY;
        color = '#ef4444';
      }
      bars += '<rect x="' + x + '" y="' + y.toFixed(1) + '" width="' + barW + '" height="' + barH.toFixed(1) + '" fill="' + color + '" rx="1"/>';
    }
    var zeroLine = '<line x1="' + PAD + '" y1="' + midY + '" x2="' + (W - PAD) + '" y2="' + midY + '" stroke="#555" stroke-width="0.5"/>';
    return '<span class="broker-spark-bar"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + zeroLine + bars + '</svg></span>';
  }

  function buildStockInfo(raw){

    const trend = sig.trend || '觀察中';
    const chipScore = sig.chip_score != null ? sig.chip_score : null;
    const status = '✅ 籌碼訊號已載入 | Score=' + scoreU +
      ' | 籌碼總分=' + (chipScore != null ? chipScore : '-') +
      ' | 5D=' + c5 + '% | 20D=' + c20 + '% | ' + trend;
    return {
      id: raw.stock_id,
      name: raw.stock_name || raw.stock_id,
      status: status,
      last_update: raw.last_update || '',
      probe_date: raw.probe_date || '',
      signals: Object.assign({}, sig, { score_unified: scoreU, flags: buildFlags(sig) }),
      history_labels: raw.history_labels || [],
      whale_data: raw.whale_data || [],
      total_whale_values: raw.total_whale_values || [],
      top6_details: raw.top6_details || [],
      headline: raw.headline && typeof raw.headline === 'object' ? raw.headline : null,
      whale_layers: raw.whale_layers && typeof raw.whale_layers === 'object' ? raw.whale_layers : null
    };
  }

    el('loading').style.display = 'block';
    el('loading').textContent = '載入中…';
    fetchNoStore(DATA_BASE + '/' + id + '_whale_track.json')
      .then(function(r){ if (!r.ok) throw new Error('無法載入 ' + id); return r.json(); })
      .then(function(raw){
        allStockData[String(id)] = raw;
        try {
          const stock = buildStockInfo(raw);
          render(stock);
        } catch (err) {
          console.error('render', err);
          el('loading').style.display = 'block';
          el('loading').innerHTML = '<div class="text-danger">儀表板渲染失敗（請試 Ctrl+F5 硬性重新整理）。<br><code style="font-size:0.78rem;word-break:break-all;">' +
            escapeHtml(String(err && err.message ? err.message : err)) + '</code></div>';
          return;
        }
        buildCompareTable();
      })
      .catch(function(err){
        el('loading').innerHTML = '<div class="text-warning">⚠️ ' + err.message + '。請確認已執行 scraper 並將 data/ 推送到 GitHub。</div>';
        el('loading').style.display = 'block';
      });
  }

  function loadManifest(){
    fetchNoStore(DATA_BASE + '/manifest.json')
      .then(function(r){
        if (!r.ok) throw new Error('找不到 manifest.json');
        return r.json();
      })
      .then(function(m){
        manifest = m;
        loadSignalStats();
        const sel = el('stockSelect');
        const input = el('stockSearch');
        const stocks = manifest.stocks && manifest.stocks.length
          ? manifest.stocks
          : (manifest.stock_ids || []).map(function(sid){ return { id: sid, name: sid }; });
        compareStockOrder = stocks.map(function(s) { return String(s.id); });

        function renderOptions(filterText){
          sel.innerHTML = '';
          const ft = normText(filterText || '');
          const filtered = !ft ? stocks : stocks.filter(function(s){
            const id = normText(s.id);
            const name = normText(s.name || '');
            return id.indexOf(ft) >= 0 || name.indexOf(ft) >= 0;
          });
          if (filtered.length === 0){
            const o = document.createElement('option');
            o.value = '';
            o.textContent = '尚無符合股票';
            sel.appendChild(o);
            return;
          }
          filtered.forEach(function(s){
            const o = document.createElement('option');
            o.value = s.id;
            o.textContent = (s.name ? s.name + ' (' + s.id + ')' : s.id);
            sel.appendChild(o);
          });
          // 若目前選項不在過濾結果中，預設選第一筆
          if (!sel.value && filtered[0]){
            sel.value = filtered[0].id;
          }
        }

        if (stocks.length === 0){
          renderOptions('');
          el('loading').innerHTML = '<div class="text-muted">請在本機執行 <code>python scraper_chip.py --stock_id 2454</code> 並將 data/ 推送到 GitHub 後重新整理。</div>';
          return;
        }

        if (input){
          input.value = '';
        }
        renderOptions('');

        sel.addEventListener('change', function(){
          if (sel.value) {
            updatePhase2Link(sel.value);
            loadStock(sel.value);
          }
        });

        if (input){
          input.addEventListener('input', function(){
            renderOptions(input.value);
          });
          input.addEventListener('keydown', function(ev){
            if (ev.key === 'Enter'){
              ev.preventDefault();
              // 重新過濾一次並直接用目前 select 的第一筆
              renderOptions(input.value);
              if (sel.value){
                loadStock(sel.value);
              }
            }
          });
        }

        // 預設載入 DEFAULT_STOCK（若 manifest 有該檔），否則第一檔（等大盤情境後再載入個股標籤）
        var defaultId = resolveDefaultStockId(stocks);
        function loadDefaultStock(){
          if (defaultId){
            sel.value = defaultId;
            updatePhase2Link(defaultId);
            sel.dispatchEvent(new Event('change'));
          }
        }
        var preloadIds = compareStockOrder.slice();
        Promise.all([loadSignalStats(), loadMarketContext()])
          .then(function() { return preloadAllStocks(preloadIds); })
          .then(loadDefaultStock)
          .catch(function() {
            return preloadAllStocks(preloadIds);
          })
          .then(loadDefaultStock);
      })
      .catch(function(err){
        el('stockSelect').innerHTML = '<option value="">無法載入清單</option>';
        el('loading').innerHTML = '<div class="text-warning">⚠️ ' + err.message + '。請確認倉庫中有 <code>data/manifest.json</code>（執行 scraper 會自動產生）。</div>';
      });
  }

  loadManifest();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBootstrapTooltips);
  } else {
    initBootstrapTooltips();
  }
  applyVersion();

  (function initPhase3(){
    var frame = el('phase3Frame');
    var errBox = el('phase3Error');
    if (!frame) return;

    function showPhase3Error(msg){
      if (errBox){
        errBox.innerHTML = msg;
        errBox.classList.add('show');
      }
      frame.classList.add('d-none');
      frame.removeAttribute('src');
    }

    function showPhase3Frame(src){
      if (errBox) errBox.classList.remove('show');
      frame.classList.remove('d-none');
      frame.src = src;
    }

    function setHorizon(h){
      var rel = DATA_BASE + '/ml_winrate_report_ret' + h + 'd.html';
      document.querySelectorAll('[data-phase3-horizon]').forEach(function(btn){
        btn.classList.toggle('active', String(btn.getAttribute('data-phase3-horizon')) === String(h));
      });
      if (errBox){
        errBox.classList.add('show');
        errBox.innerHTML = '載入勝率報告中…';
      }
      frame.classList.add('d-none');
      fetch(rel, { method: 'HEAD', cache: 'no-store' })
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          showPhase3Frame(rel);
        })
        .catch(function(){
          showPhase3Error(
            '<strong>無法載入 Phase 3 報告</strong>（<code>' + rel + '</code>）<br>' +
            '請在本機執行 <code>python sub-py/ml_signal_winrate.py --horizons 5,10,20</code> ' +
            '或 <code>bat/7_phase3_ml_winrate.bat</code>，產生 HTML 後 push 到 GitHub Pages。'
          );
        });
    }

    document.querySelectorAll('[data-phase3-horizon]').forEach(function(btn){
      btn.addEventListener('click', function(){
        setHorizon(btn.getAttribute('data-phase3-horizon'));
      });
    });

    frame.addEventListener('error', function(){
      showPhase3Error(
        '<strong>iframe 載入失敗</strong>。請確認 <code>data/ml_winrate_report_ret*.html</code> 已存在並已推送。'
      );
    });

    setHorizon('20');
  })();

  window.toggleCompare = toggleCompare;
  window.selectStock = selectStock;
  window.dismissAlert = dismissAlert;
})();
</script>
</body>
</html>
