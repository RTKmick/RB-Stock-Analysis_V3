<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB 籌碼戰情室 - 靜態 Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    .led-pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:#1e1e1e; border:1px solid #3a3a3a; color:#cfcfcf; font-weight:700; font-size:0.95rem; }
    .led-pill.off{ opacity:.55; }
    .led-pill.off .led-dot{ background:#555; }
    .led-dot{ width:10px; height:10px; border-radius:50%; background:#666; }
    .led-pill.on .led-dot{ background:#22c55e; box-shadow:0 0 10px rgba(34,197,94,.9); }
    .led-pill.danger .led-dot{ background:#ef4444; box-shadow:0 0 10px rgba(239,68,68,.9); }
    .led-pill.warn .led-dot{ background:#eab308; box-shadow:0 0 10px rgba(234,179,8,.9); }
    .led-group{ display:flex; flex-wrap:wrap; gap:10px; }
    .broker-chip{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
    body{ background:#0c0c0c; color:#e0e0e0; font-family:'Segoe UI',Microsoft JhengHei,sans-serif; }
    .card{ background:#1a1a1a; border:1px solid #333; margin-bottom:20px; border-radius:12px; }
    .status-pass{ color:#2ecc71; font-weight:bold; }
    .status-fail{ color:#e74c3c; font-weight:bold; }
    .status-warn{ color:#f1c40f; font-weight:bold; }
    .update-time{ font-size:0.85em; color:#888; }
    .table-dark{ --bs-table-bg:#1a1a1a; font-size:0.85em; }
    .table-dark th{ color:#f1c40f; }
    .buy-row{ color:#ff4444; font-weight:bold; }
    .sell-row{ color:#66b2ff; font-weight:bold; }
    .metric-card{ text-align:center; padding:15px; border-radius:8px; background:#252525; }
    .metric-value{ font-size:1.8rem; font-weight:bold; color:#f1c40f; }
    .metric-label{ font-size:0.8rem; color:#aaa; }
    .tag-pill{ display:inline-block; padding:4px 10px; border-radius:999px; background:#2b2b2b; color:#ddd; font-size:0.8rem; margin-right:6px; margin-top:6px; border:1px solid #444; }
    .chart-container{ position:relative; height:350px; width:100%; margin-bottom:20px; }
    .chart-container-bar{ position:relative; height:420px; width:100%; margin-bottom:20px; }
    .chart-container-mini{ position:relative; height:240px; width:100%; margin-bottom:20px; }
    .cost-zone-container{ background:#0f0f0f; border-radius:8px; padding:15px; border-left:4px solid #f1c40f; margin-bottom:20px; }
    .cost-bar-track{ position:relative; height:6px; background:#333; border-radius:4px; margin-top:6px; }
    .cost-bar-range{ position:absolute; top:0; height:6px; background:linear-gradient(90deg,#f97316,#22c55e); border-radius:4px; }
    .cost-bar-close{ position:absolute; top:-3px; width:2px; height:12px; background:#e5e7eb; }
    .cost-bar-label{ font-size:0.8rem; color:#f9fafb; margin-top:4px; }
    .kpi-hero{ padding:16px; border-radius:10px; border:1px solid #333; text-align:center; }
    .kpi-hero .kpi-title{ font-size:0.85rem; color:#aaa; }
    .kpi-hero .kpi-num{ font-size:1.8rem; font-weight:bold; }
    .kpi-hero.pos .kpi-num{ color:#2ecc71; }
    .kpi-hero.neg .kpi-num{ color:#e74c3c; }
    .kpi-hero .kpi-sub{ font-size:0.8rem; color:#888; }
    .text-info-dash{ color:#5bc0de; }
    .dashboard-subtitle{ color:#9ca3af; font-size:0.95rem; }
    .org-foreign{ color:#c084fc; font-weight:600; }
    .org-local{ color:#84cc16; font-weight:600; }
    .page-title{ color:#f1c40f; }
    .stock-search-input{ max-width:220px; font-size:1.4rem; }
    .stock-select-input{ max-width:260px; font-size:1.4rem; }
    .report-iframe{ width:100%; height:80vh; border:none; margin-top:16px; }
    .report-iframe-phase3{ margin-top:12px; }
    .phase3-hint{ font-size:0.9rem; }
    .phase3-error{ display:none; margin-top:12px; padding:1rem 1.25rem; border-radius:8px;
      background:#2a1515; border:1px solid #7f1d1d; color:#fecaca; }
    .phase3-error.show{ display:block; }
    .nav-link-ext .tab-ext-icon{ font-size:0.85em; opacity:0.85; margin-left:2px; }
    .coherence-spark { margin-top: 10px; }
    .coherence-spark-label { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
    .market-bar {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .market-kpi { text-align: center; min-width: 120px; }
    .market-kpi .mk-label { font-size: 0.72rem; color: #9ca3af; margin-bottom: 2px; }
    .market-kpi .mk-value { font-size: 1.1rem; font-weight: 700; }
    .market-kpi .mk-sub { font-size: 0.7rem; color: #6b7280; }
    .market-state-badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .ms-risk-on   { background: #052e16; color: #22c55e; border: 1px solid #166534; }
    .ms-cautious  { background: #422006; color: #eab308; border: 1px solid #854d0e; }
    .ms-neutral   { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
    .ms-risk-off  { background: #2d0a0a; color: #ef4444; border: 1px solid #7f1d1d; }
    .stock-context-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 600;
    }
    .sct-follow  { background: #1e3a5f; color: #60a5fa; }
    .sct-diverge { background: #3b1f00; color: #fb923c; }
  </style>
</head>
<body>
<div class="container py-5">
  <h1 class="mb-2 text-center page-title" id="dashboardTitle">📊 RUNBOR 籌碼戰情室</h1>
  <div class="text-center mb-2">
    <span class="badge bg-secondary" id="versionBadge">版本：載入中…</span>
  </div>

  <div id="marketBar"></div>

  <!-- 全域股票選擇器：所有分頁共用 -->
  <div class="row justify-content-center mb-3">
    <div class="col-lg-10">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <label class="mb-0 fs-3 fw-bold text-white" for="stockSearch">切換股票：</label>
        <input id="stockSearch"
               class="form-control form-control-lg bg-dark text-white border-secondary stock-search-input"
               placeholder="過濾用：如 6239、力成（清空＝顯示全部）" />
        <select id="stockSelect" class="form-select form-select-lg bg-dark text-white border-secondary stock-select-input">
          <option value="">載入中…</option>
        </select>
      </div>
      <div class="text-secondary small mt-2 px-1">選單會依左方搜尋框<strong>即時過濾</strong>；找不到代號時請<strong>刪光搜尋框</strong>或按 F5 重新整理。</div>
    </div>
  </div>

  <ul class="nav nav-tabs mb-3" id="rbTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="tab-dashboard" data-bs-toggle="tab"
              data-bs-target="#panel-dashboard" type="button" role="tab">
        分數儀表板
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tab-phase1" data-bs-toggle="tab"
              data-bs-target="#panel-phase1" type="button" role="tab">
        報酬分析
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tab-phase3" data-bs-toggle="tab"
              data-bs-target="#panel-phase3" type="button" role="tab">
        勝率評估表
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link nav-link-ext" id="tab-phase2" href="dashboard.html?stock=6239"
         target="_blank" rel="noopener noreferrer"
         title="Phase 2：一眼看盤（新分頁開啟，會帶入目前選擇的股票代號）">
        Phase 2 一眼看盤 <span class="tab-ext-icon" aria-hidden="true">↗</span>
      </a>
    </li>
  </ul>

  <div class="tab-content" id="rbTabsContent">
    <div class="tab-pane fade show active" id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard">
      <div id="content"></div>
      <div id="loading" class="text-center text-muted py-5">載入預設股票（6239）…</div>
    </div>

    <div class="tab-pane fade" id="panel-phase1" role="tabpanel" aria-labelledby="tab-phase1">
      <iframe src="data/signal_vs_returns_report.html"
              class="report-iframe"
              title="Phase 1 Signal vs Returns Report"></iframe>
    </div>

    <div class="tab-pane fade" id="panel-phase3" role="tabpanel" aria-labelledby="tab-phase3">
      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
        <div class="text-info">選擇時間視窗（5日警示燈／10日輔助燈／20日決策燈）：</div>
        <div class="btn-group" role="group" aria-label="Phase 3 horizon">
          <button type="button" class="btn btn-sm btn-outline-warning" data-phase3-horizon="5">ret_5d（警示燈）</button>
          <button type="button" class="btn btn-sm btn-outline-warning" data-phase3-horizon="10">ret_10d（輔助燈）</button>
          <button type="button" class="btn btn-sm btn-outline-warning active" data-phase3-horizon="20">ret_20d（決策燈）</button>
        </div>
      </div>
      <div id="phase3Error" class="phase3-error" role="alert"></div>
      <iframe id="phase3Frame"
              class="report-iframe report-iframe-phase3 d-none"
              title="Phase 3 ML Winrate Report"></iframe>
      <div class="text-muted mt-2 phase3-hint">
        若顯示空白：請先在本機執行 <code>bat/7_phase3_ml_winrate.bat</code> 產生 <code>data/ml_winrate_report_ret*.html</code>，並推送到 GitHub Pages。
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  const DATA_BASE = 'data';
  const DEFAULT_STOCK = '6239';
  let manifest = { stock_ids: [], stocks: [] };
  var marketCtx = null;
  let charts = { whale: null, radar: null, breadth: null, coherence: null, tornadoBuy: null, tornadoSell: null };

  function loadMarketContext() {
    return fetch(DATA_BASE + '/market_context.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        marketCtx = d;
        renderMarketBar(d);
        return d;
      })
      .catch(function() {
        marketCtx = null;
      });
  }

  function renderMarketBar(ctx) {
    var host = document.getElementById('marketBar');
    if (!host || !ctx) return;
    var t = ctx.taiex || {};
    var inst = ctx.institutional || {};
    var ms = ctx.market_state || 'NEUTRAL';
    var msReason = ctx.market_state_reason || '';
    var msClass = {
      'RISK_ON': 'ms-risk-on',
      'CAUTIOUS': 'ms-cautious',
      'NEUTRAL': 'ms-neutral',
      'RISK_OFF': 'ms-risk-off'
    }[ms] || 'ms-neutral';
    var msText = {
      'RISK_ON': '🟢 多頭格局',
      'CAUTIOUS': '🟡 留意風險',
      'NEUTRAL': '⚫ 方向不明',
      'RISK_OFF': '🔴 偏空警戒'
    }[ms] || '⚫ 觀察中';
    var fRaw1d = inst.foreign_net_1d != null ? Number(inst.foreign_net_1d) : null;
    var fRaw5d = inst.foreign_net_5d != null ? Number(inst.foreign_net_5d) : null;
    var fNet1d = fRaw1d != null ? (fRaw1d / 100000000).toFixed(1) : '-';
    var fNet5d = fRaw5d != null ? (fRaw5d / 100000000).toFixed(1) : '-';
    var fStreak = inst.foreign_streak_sell || 0;
    var streakText = fStreak >= 2 ? '（連賣' + fStreak + '日）' : '';
    var changePct = t.change_pct != null ? t.change_pct : 0;
    var changeColor = changePct >= 0 ? '#22c55e' : '#ef4444';
    var changeSign = changePct >= 0 ? '+' : '';
    var closeFmt = t.close != null ? Number(t.close).toLocaleString('zh-TW', { maximumFractionDigits: 2 }) : '-';
    var html = '<div class="market-bar">';
    html += '<div><span class="market-state-badge ' + msClass + '">' + msText + '</span></div>';
    html += '<div class="market-kpi"><div class="mk-label">加權指數</div>';
    html += '<div class="mk-value" style="color:' + changeColor + ';">' + closeFmt + '</div>';
    html += '<div class="mk-sub">' + changeSign + changePct + '%</div></div>';
    html += '<div class="market-kpi"><div class="mk-label">外資今日</div>';
    html += '<div class="mk-value" style="color:' + ((fRaw1d != null && fRaw1d >= 0) ? '#22c55e' : '#ef4444') + ';">' + fNet1d + ' 億</div>';
    html += '<div class="mk-sub">' + streakText + '</div></div>';
    html += '<div class="market-kpi"><div class="mk-label">外資5日</div>';
    html += '<div class="mk-value" style="color:' + ((fRaw5d != null && fRaw5d >= 0) ? '#22c55e' : '#ef4444') + ';">' + fNet5d + ' 億</div></div>';
    var t20 = t.trend_20d_pct != null ? t.trend_20d_pct : 0;
    html += '<div class="market-kpi"><div class="mk-label">20日趨勢</div>';
    html += '<div class="mk-value" style="color:' + (t20 >= 0 ? '#22c55e' : '#ef4444') + ';">' + (t20 >= 0 ? '+' : '') + t20 + '%</div></div>';
    if (msReason) {
      html += '<div style="flex-basis:100%; font-size:0.78rem; color:#6b7280; margin-top:4px;">' + escapeHtml(msReason) + '</div>';
    }
    html += '</div>';
    host.innerHTML = html;
  }

  function getStockContextTag(stockSignals) {
    if (!marketCtx || !marketCtx.institutional) return '';
    var mktDir = marketCtx.institutional.foreign_net_5d > 0 ? 'BUY' : 'SELL';
    var stockDir = parseFloat(stockSignals.inst_foreign_net_5d || 0) > 0 ? 'BUY' : 'SELL';
    var same = mktDir === stockDir;
    var cls  = same ? 'sct-follow' : 'sct-diverge';
    var text = same ? '跟隨大盤' : '獨立走勢';
    return '<span class="stock-context-tag ' + cls + '">' + text + '</span>';
  }
  function destroyCharts(){
    ['whale','radar','breadth','coherence','tornadoBuy','tornadoSell'].forEach(function(k){ if (charts[k]) { try { charts[k].destroy(); } catch(e){} charts[k]=null; } });
  }

  function el(id){ return document.getElementById(id); }

  function updatePhase2Link(stockId){
    var a = el('tab-phase2');
    if (!a) return;
    var sid = String(stockId || DEFAULT_STOCK).trim() || DEFAULT_STOCK;
    a.href = 'dashboard.html?stock=' + encodeURIComponent(sid);
  }

  function resolveDefaultStockId(stocks){
    if (!stocks || !stocks.length) return '';
    var ids = stocks.map(function(s){ return String(s.id); });
    if (ids.indexOf(DEFAULT_STOCK) >= 0) return DEFAULT_STOCK;
    return stocks[0].id;
  }
  function escapeHtml(s){
    if (s == null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function normText(s){
    return String(s || '').trim().toLowerCase();
  }
  function computeForeignMomentumLabel(signals) {
    if (signals.inst_foreign_momentum_label) {
      return String(signals.inst_foreign_momentum_label);
    }
    const f5 = parseFloat(signals.inst_foreign_net_5d || 0) || 0;
    const f20 = parseFloat(signals.inst_foreign_net_20d || 0) || 0;
    const speed5 = f5 / 5;
    const speed20 = f20 / 20;
    let momentum = 'NEUTRAL';
    if (speed20 !== 0) {
      const ratio = speed5 / speed20;
      if (ratio >= 1.3) momentum = 'ACCELERATING';
      else if (ratio <= 0.7) momentum = 'DECELERATING';
      else momentum = 'STABLE';
    }
    let base = 'NEUTRAL';
    if (f20 > 0) base = 'BUY';
    else if (f20 < 0) base = 'SELL';
    return base + '_' + momentum;
  }
  function getForeignMomentumClass(label) {
    if (label === 'BUY_ACCELERATING') return 'on';
    if (label === 'BUY_DECELERATING') return 'warn';
    if (label === 'SELL_DECELERATING') return 'warn';
    if (label === 'SELL_ACCELERATING') return 'danger';
    return 'off';
  }
  function getForeignMomentumText(label) {
    const map = {
      'BUY_ACCELERATING': '外資加速買',
      'BUY_STABLE': '外資穩定買',
      'BUY_DECELERATING': '外資買力減弱',
      'SELL_ACCELERATING': '外資加速賣',
      'SELL_STABLE': '外資穩定賣',
      'SELL_DECELERATING': '外資賣力減弱',
      'NEUTRAL_STABLE': '外資觀望中',
      'NEUTRAL_NEUTRAL': '外資觀望中'
    };
    return map[label] || '外資動向不明';
  }
  function computeTrustMomentumLabel(signals) {
    if (signals.inst_trust_momentum_label) {
      return String(signals.inst_trust_momentum_label);
    }
    var t5 = parseFloat(signals.inst_trust_net_5d || 0) || 0;
    var t20 = parseFloat(signals.inst_trust_net_20d || 0) || 0;
    var speed5 = t5 / 5;
    var speed20 = t20 / 20;
    var momentum = 'NEUTRAL';
    if (speed20 !== 0) {
      var ratio = speed5 / speed20;
      if (ratio >= 1.3) momentum = 'ACCELERATING';
      else if (ratio <= 0.7) momentum = 'DECELERATING';
      else momentum = 'STABLE';
    }
    var base = t20 > 0 ? 'BUY' : (t20 < 0 ? 'SELL' : 'NEUTRAL');
    return base + '_' + momentum;
  }
  function getTrustMomentumClass(label) {
    if (label === 'BUY_ACCELERATING') return 'on';
    if (label === 'BUY_DECELERATING') return 'warn';
    if (label === 'SELL_DECELERATING') return 'warn';
    if (label === 'SELL_ACCELERATING') return 'danger';
    return 'off';
  }
  function getTrustMomentumText(label) {
    var map = {
      'BUY_ACCELERATING': '投信加速買',
      'BUY_STABLE': '投信穩定買',
      'BUY_DECELERATING': '投信買力減弱',
      'SELL_ACCELERATING': '投信加速賣',
      'SELL_STABLE': '投信穩定賣',
      'SELL_DECELERATING': '投信賣力減弱',
      'NEUTRAL_STABLE': '投信觀望',
      'NEUTRAL_NEUTRAL': '投信觀望'
    };
    return map[label] || '投信動向不明';
  }
  function foreignMomentumEmoji(label) {
    var emoji = {
      'BUY_ACCELERATING': '🟢買↑↑',
      'BUY_STABLE': '🟢買→',
      'BUY_DECELERATING': '🟡買↓',
      'SELL_ACCELERATING': '🔴賣↑↑',
      'SELL_STABLE': '⚫賣→',
      'SELL_DECELERATING': '🟡賣↓'
    };
    return emoji[label] || '⚫—';
  }
  function loadMomentumLabels(stocks) {
    if (!stocks || !stocks.length) return;
    stocks.forEach(function(s) {
      var url = DATA_BASE + '/' + encodeURIComponent(s.id) + '_whale_track.json';
      fetch(url)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) {
          if (!d) return;
          var sig = d.signals || {};
          var label = computeForeignMomentumLabel(sig);
          var tag = foreignMomentumEmoji(label);
          var sel = document.getElementById('stockSelect');
          if (!sel) return;
          Array.from(sel.options).forEach(function(opt) {
            if (opt.value === s.id) {
              opt.textContent = (s.name ? s.name + ' (' + s.id + ')' : s.id) + '  ' + tag;
            }
          });
        })
        .catch(function() {});
    });
  }
  function buildFlags(signals){
    const buy5 = parseFloat(signals.buy_count_5d || 0) || 0;
    const sell5 = parseFloat(signals.sell_count_5d || 0) || 0;
    const score_u = parseFloat(signals.score_unified || signals.score || 0) || 0;
    const trend = String(signals.trend || '');
    const fMomentum = computeForeignMomentumLabel(signals);
    const tMomentum = computeTrustMomentumLabel(signals);
    const alignVal = parseInt(signals.inst_three_align_5d || 0, 10);
    return {
      foreign_momentum_class: getForeignMomentumClass(fMomentum),
      foreign_momentum_text: getForeignMomentumText(fMomentum),
      foreign_momentum_label: fMomentum,
      trust_momentum_class: getTrustMomentumClass(tMomentum),
      trust_momentum_text: getTrustMomentumText(tMomentum),
      breadth_expand: (buy5-sell5)>0 ? 1 : 0,
      net_sell_dominate: (trend.indexOf('偏空')>=0 || score_u<=30) ? 1 : 0,
      strength_high: score_u>=75 ? 1 : 0,
      inst_align: alignVal
    };
  }
  function buildCoherenceSparkline(series, slope) {
    if (!series || series.length < 2) return '';
    var W = 280, H = 48, PAD = 5;
    var n = series.length;
    var minV = Math.min.apply(null, series);
    var maxV = Math.max.apply(null, series);
    minV = Math.min(minV, 0.5);
    maxV = Math.max(maxV, 1.5);
    var range = maxV - minV || 1;
    var drawW = W - PAD * 2;
    var drawH = H - PAD * 2;
    var pts = series.map(function(v, i) {
      var x = PAD + (i / (n - 1)) * drawW;

          { label: '賣超家數', data: sellSer, borderColor: '#66b2ff', borderWidth: 2, tension: 0, pointRadius: 2 },
          { label: '差值', data: breadthSer, borderColor: '#f1c40f', borderWidth: 3, tension: 0, pointRadius: 2 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { ticks: { color: '#aaa' }, grid: { color: '#333' } }, y: { ticks: { color: '#aaa' }, grid: { color: '#333' } } }, plugins: { legend: { position: 'bottom' } } }
      });
    }

    var cohSer = (sig.enhanced && sig.enhanced.coherence_series_20d) ? sig.enhanced.coherence_series_20d : [];
    var cCtx = document.getElementById('coherenceCanvas');
    if (cCtx && labels20.length && cohSer.length) {
      var refLine = labels20.map(function(){ return 1.2; });
      charts.coherence = new Chart(cCtx.getContext('2d'), {
        type: 'line',
        data: { labels: labels20, datasets: [
          { label: 'Coherence', data: cohSer, borderColor: '#f1c40f', borderWidth: 3, tension: 0.2, pointRadius: 2 },
          { label: 'Threshold(1.2)', data: refLine, borderColor: '#66b2ff', borderWidth: 1, borderDash: [6,6], pointRadius: 0 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#aaa' }, grid: { color: '#333' } }, y: { suggestedMin: 0, suggestedMax: 3, ticks: { color: '#aaa' }, grid: { color: '#333' } } }, plugins: { legend: { position: 'bottom' } } }
      });
    }

    // Inst vs SBL chart (20D) - 真正雙軸圖：三大法人用左軸，借券量用右軸，單位統一成「千張」
    var instSblCtx = document.getElementById('instSblCanvas');
    if (instSblCtx) {
      var instVal = instThree20;
      // 若完全沒有 sbl_volume_20d 欄位，且三大法人 20 日合計也為 0，視為尚無 cross-check 資料
      var hasSblKey = Object.prototype.hasOwnProperty.call(sig, 'sbl_volume_20d');
      var rawSbl = hasSblKey ? sig.sbl_volume_20d : null;
      var sblVal = Number(rawSbl || 0);
      var noInstAndSblData = (!hasSblKey && (!instVal || instVal === 0));

      if (noInstAndSblData) {
        // 直接在容器上顯示提示文字，避免畫出「全 0」而誤以為有資料
        var parent = instSblCtx.parentElement;
        if (parent) {
          parent.innerHTML = '<div class="text-muted" style="padding:12px; font-size:0.85rem;">尚無三大法人 / 借券 cross-check 資料（請在本機重跑 scraper 產生最新 whale_track.json）。</div>';
        }
        charts.instSbl = null;
      } else {
        var instValK = instVal / 1000.0;
        var sblValK = sblVal / 1000.0;
        charts.instSbl = new Chart(instSblCtx.getContext('2d'), {
          type: 'bar',
          data: {
            labels: ['三大法人合計', '借券成交量'],
            datasets: [
              {
                label: '三大法人 20日累計 (千張)',
                data: [instValK, null],
                backgroundColor: instVal >= 0 ? 'rgba(34,197,94,0.85)' : 'rgba(249,115,22,0.85)',
                borderWidth: 0,
                barThickness: 28,
                yAxisID: 'yInst'
              },
              {
                label: '借券成交量 20日累計 (千張)',
                data: [null, sblValK],
                backgroundColor: 'rgba(56,189,248,0.85)',
                borderWidth: 0,
                barThickness: 28,
                yAxisID: 'ySbl'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              yInst: {
                position: 'left',
                grid: { color: '#333' },
                ticks: { color: '#aaa' },
                title: { display: true, text: '三大法人 20日累計 (千張)', color: '#aaa' }
              },
              ySbl: {
                position: 'right',
                grid: { drawOnChartArea: false },
                ticks: { color: '#38bdf8' },
                title: { display: true, text: '借券成交量 20日累計 (千張)', color: '#38bdf8' }
              },
              x: {
                grid: { color: '#333' },
                ticks: { color: '#aaa' }
              }
            },
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });
      }
    }

    // 借券異常尖峰圖（預期使用近 60 日逐日借券量）
    var sblSpikeCtx = document.getElementById('sblSpikeCanvas');
    var sblSer60 = Array.isArray(sig.sbl_volume_series_60d) ? sig.sbl_volume_series_60d : [];
    var sblLabels60 = Array.isArray(sig.sbl_labels_60d) ? sig.sbl_labels_60d : (stock.history_labels || []);
    if (sblSpikeCtx && sblSer60.length && sblLabels60.length === sblSer60.length) {
      var n60 = sblSer60.length;
      var sum60 = sblSer60.reduce(function(acc, v){ return acc + (Number(v) || 0); }, 0);
      var mu60 = sum60 / n60;
      var var60 = sblSer60.reduce(function(acc, v){
        var x = (Number(v) || 0) - mu60;
        return acc + x * x;
      }, 0) / Math.max(1, n60 - 1);
      var sd60 = Math.sqrt(var60);
      if (!isFinite(sd60) || sd60 < 1e-6) sd60 = 1.0;

      var zSeries = sblSer60.map(function(v){
        return ((Number(v) || 0) - mu60) / sd60;
      });
      var spikeSeries = sblSer60.map(function(v, idx){
        var z = zSeries[idx];
        var val = Number(v) || 0;
        return (z >= 2.0 && val >= mu60 * 3.0) ? val : null;
      });
      var meanLine = sblSer60.map(function(){ return mu60; });

      charts.sblSpike = new Chart(sblSpikeCtx.getContext('2d'), {
        type: 'line',
        data: {
          labels: sblLabels60,
          datasets: [
            {
              label: '借券量（張）',
              data: sblSer60,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56,189,248,0.2)',
              borderWidth: 2,
              tension: 0.1,
              pointRadius: 1.5
            },
            {
              label: '60日平均',
              data: meanLine,
              borderColor: '#9ca3af',
              borderWidth: 1,
              borderDash: [6, 6],
              pointRadius: 0
            },
            {
              label: '異常尖峰',
              data: spikeSeries,
              type: 'scatter',
              pointBackgroundColor: '#ef4444',
              pointBorderColor: '#f97316',
              pointRadius: 4,
              pointHoverRadius: 6,
              showLine: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: {
              grid: { color: '#333' },
              ticks: { color: '#aaa', maxRotation: 0, autoSkip: true }
            },
            y: {
              grid: { color: '#333' },
              ticks: { color: '#aaa' },
              title: { display: true, text: '借券成交量（張）', color: '#aaa' }
            }
          },
          plugins: {
            legend: { position: 'bottom' },
            tooltip: {
              callbacks: {
                label: function(ctx){
                  var v = ctx.parsed.y;
                  var z = zSeries[ctx.dataIndex];
                  return ' 借券量：' + v + ' 張（z=' + z.toFixed(2) + '）';
                }
              }
            }
          }
        }
      });
    }

    var buyList = (sig.top_buy_15 || []).slice(0, 15).sort(function(a,b){ return (b.net_lot||0) - (a.net_lot||0); });
    var sellList = (sig.top_sell_15 || []).slice(0, 15).sort(function(a,b){ return (a.net_lot||0) - (b.net_lot||0); });
    var buyLabels = buyList.map(function(r){ return (r.broker_id||'') + ' ' + (r.broker_name||''); });
    var buyVals = buyList.map(function(r){ return Math.max(0, Number(r.net_lot||0)); });
    var sellLabels = sellList.map(function(r){ return (r.broker_id||'') + ' ' + (r.broker_name||''); });
    var sellVals = sellList.map(function(r){ return Math.abs(Math.min(0, Number(r.net_lot||0))); });
    var maxAbs = Math.max(1, Math.max.apply(null, buyVals.concat(sellVals)));
    var tBuy = document.getElementById('tornadoBuyCanvas');
    var tSell = document.getElementById('tornadoSellCanvas');
    if (tBuy && buyVals.length) {
      charts.tornadoBuy = new Chart(tBuy.getContext('2d'), {
        type: 'bar',
        data: { labels: buyLabels, datasets: [{ label: '買超', data: buyVals, backgroundColor: '#84cc16', borderWidth: 0, barThickness: 14 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { min: 0, max: maxAbs, reverse: true, grid: { color: '#2b2b2b' }, ticks: { color: '#9a9a9a' } }, y: { position: 'left', grid: { display: false }, ticks: { color: '#d0d0d0' } } }, plugins: { legend: { display: false } } }
      });
    }
    if (tSell && sellVals.length) {
      charts.tornadoSell = new Chart(tSell.getContext('2d'), {
        type: 'bar',
        data: { labels: sellLabels, datasets: [{ label: '賣超', data: sellVals, backgroundColor: '#e06a6a', borderWidth: 0, barThickness: 14 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { min: 0, max: maxAbs, grid: { color: '#2b2b2b' }, ticks: { color: '#9a9a9a' } }, y: { position: 'right', grid: { display: false }, ticks: { color: '#d0d0d0' } } }, plugins: { legend: { display: false } } }
      });
    }
  }

  function buildStockInfo(raw){
    const sig = raw.signals || {};
    const scoreU = sig.final_score != null ? sig.final_score : (sig.score != null ? sig.score : 0);
    const c5 = sig.concentration_5d != null ? sig.concentration_5d : 0;
    const c20 = sig.concentration_20d != null ? sig.concentration_20d : 0;
    const trend = sig.trend || '觀察中';
    const chipScore = sig.chip_score != null ? sig.chip_score : null;
    const status = '✅ 籌碼訊號已載入 | Score=' + scoreU +
      ' | 籌碼總分=' + (chipScore != null ? chipScore : '-') +
      ' | 5D=' + c5 + '% | 20D=' + c20 + '% | ' + trend;
    return {
      id: raw.stock_id,
      name: raw.stock_name || raw.stock_id,
      status: status,
      last_update: raw.last_update || '',
      probe_date: raw.probe_date || '',
      signals: Object.assign({}, sig, { score_unified: scoreU, flags: buildFlags(sig) }),
      history_labels: raw.history_labels || [],
      whale_data: raw.whale_data || [],
      total_whale_values: raw.total_whale_values || [],
      top6_details: raw.top6_details || [],
      headline: raw.headline && typeof raw.headline === 'object' ? raw.headline : null,
      whale_layers: raw.whale_layers && typeof raw.whale_layers === 'object' ? raw.whale_layers : null
    };
  }

  function loadStock(id){
    el('loading').style.display = 'block';
    el('loading').textContent = '載入中…';
    fetch(DATA_BASE + '/' + id + '_whale_track.json')
      .then(function(r){ if (!r.ok) throw new Error('無法載入 ' + id); return r.json(); })
      .then(function(raw){
        const stock = buildStockInfo(raw);
        render(stock);
      })
      .catch(function(err){
        el('loading').innerHTML = '<div class="text-warning">⚠️ ' + err.message + '。請確認已執行 scraper 並將 data/ 推送到 GitHub。</div>';
        el('loading').style.display = 'block';
      });
  }

  function loadManifest(){
    fetch(DATA_BASE + '/manifest.json')
      .then(function(r){
        if (!r.ok) throw new Error('找不到 manifest.json');
        return r.json();
      })
      .then(function(m){
        manifest = m;
        const sel = el('stockSelect');
        const input = el('stockSearch');
        const stocks = manifest.stocks && manifest.stocks.length
          ? manifest.stocks
          : (manifest.stock_ids || []).map(function(sid){ return { id: sid, name: sid }; });

        function renderOptions(filterText){
          sel.innerHTML = '';
          const ft = normText(filterText || '');
          const filtered = !ft ? stocks : stocks.filter(function(s){
            const id = normText(s.id);
            const name = normText(s.name || '');
            return id.indexOf(ft) >= 0 || name.indexOf(ft) >= 0;
          });
          if (filtered.length === 0){
            const o = document.createElement('option');
            o.value = '';
            o.textContent = '尚無符合股票';
            sel.appendChild(o);
            return;
          }
          filtered.forEach(function(s){
            const o = document.createElement('option');
            o.value = s.id;
            o.textContent = (s.name ? s.name + ' (' + s.id + ')' : s.id);
            sel.appendChild(o);
          });
          // 若目前選項不在過濾結果中，預設選第一筆
          if (!sel.value && filtered[0]){
            sel.value = filtered[0].id;
          }
        }

        if (stocks.length === 0){
          renderOptions('');
          el('loading').innerHTML = '<div class="text-muted">請在本機執行 <code>python scraper_chip.py --stock_id 6239</code> 並將 data/ 推送到 GitHub 後重新整理。</div>';
          return;
        }

        if (input){
          input.value = '';
        }
        renderOptions('');
        loadMomentumLabels(stocks);

        sel.addEventListener('change', function(){
          if (sel.value) {
            updatePhase2Link(sel.value);
            loadStock(sel.value);
          }
        });

        if (input){
          input.addEventListener('input', function(){
            renderOptions(input.value);
          });
          input.addEventListener('keydown', function(ev){
            if (ev.key === 'Enter'){
              ev.preventDefault();
              // 重新過濾一次並直接用目前 select 的第一筆
              renderOptions(input.value);
              if (sel.value){
                loadStock(sel.value);
              }
            }
          });
        }

        // 預設載入 DEFAULT_STOCK（若 manifest 有該檔），否則第一檔（等大盤情境後再載入個股標籤）
        var defaultId = resolveDefaultStockId(stocks);
        function loadDefaultStock(){
          if (defaultId){
            sel.value = defaultId;
            updatePhase2Link(defaultId);
            loadStock(defaultId);
          }
        }
        loadMarketContext().then(loadDefaultStock).catch(loadDefaultStock);
      })
      .catch(function(err){
        el('stockSelect').innerHTML = '<option value="">無法載入清單</option>';
        el('loading').innerHTML = '<div class="text-warning">⚠️ ' + err.message + '。請確認倉庫中有 <code>data/manifest.json</code>（執行 scraper 會自動產生）。</div>';
      });
  }

  loadManifest();
  applyVersion();

  (function initPhase3(){
    var frame = el('phase3Frame');
    var errBox = el('phase3Error');
    if (!frame) return;

    function showPhase3Error(msg){
      if (errBox){
        errBox.innerHTML = msg;
        errBox.classList.add('show');
      }
      frame.classList.add('d-none');
      frame.removeAttribute('src');
    }

    function showPhase3Frame(src){
      if (errBox) errBox.classList.remove('show');
      frame.classList.remove('d-none');
      frame.src = src;
    }

    function setHorizon(h){
      var rel = DATA_BASE + '/ml_winrate_report_ret' + h + 'd.html';
      document.querySelectorAll('[data-phase3-horizon]').forEach(function(btn){
        btn.classList.toggle('active', String(btn.getAttribute('data-phase3-horizon')) === String(h));
      });
      if (errBox){
        errBox.classList.add('show');
        errBox.innerHTML = '載入勝率報告中…';
      }
      frame.classList.add('d-none');
      fetch(rel, { method: 'HEAD', cache: 'no-store' })
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          showPhase3Frame(rel);
        })
        .catch(function(){
          showPhase3Error(
            '<strong>無法載入 Phase 3 報告</strong>（<code>' + rel + '</code>）<br>' +
            '請在本機執行 <code>python sub-py/ml_signal_winrate.py --horizons 5,10,20</code> ' +
            '或 <code>bat/7_phase3_ml_winrate.bat</code>，產生 HTML 後 push 到 GitHub Pages。'
          );
        });
    }

    document.querySelectorAll('[data-phase3-horizon]').forEach(function(btn){
      btn.addEventListener('click', function(){
        setHorizon(btn.getAttribute('data-phase3-horizon'));
      });
    });

    frame.addEventListener('error', function(){
      showPhase3Error(
        '<strong>iframe 載入失敗</strong>。請確認 <code>data/ml_winrate_report_ret*.html</code> 已存在並已推送。'
      );
    });

    setHorizon('20');
  })();
})();
</script>
</body>
</html>
