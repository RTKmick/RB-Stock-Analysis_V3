<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 2 一眼看盤｜RUNBOR 大戶儀表板</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { background: #0a0a0a; color: #e8e8e8; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; }
    .banner { background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%); border-bottom: 1px solid #2a2a2a; padding: 1.5rem 0 2rem; }
    .stock-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; color: #f1c40f; letter-spacing: 0.02em; }
    .price-pill { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; color: #fff; }
    .chip-num { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; color: #7dd3fc; line-height: 1; }
    .chip-label { font-size: 0.85rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; }
    .summary-lead { font-size: 1.05rem; line-height: 1.65; color: #d1d5db; max-width: 960px; }
    .signal-badge { font-size: 0.75rem; vertical-align: middle; }
    .lights { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
    .light { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #333; opacity: 0.28; transition: opacity 0.2s, box-shadow 0.2s; }
    .light.on { opacity: 1; box-shadow: 0 0 28px currentColor; }
    .light.green { background: #15803d; color: #22c55e; }
    .light.yellow { background: #a16207; color: #eab308; }
    .light.red { background: #991b1b; color: #f87171; }
    .layer-card { background: #121212; border: 1px solid #2d2d2d; border-radius: 14px; height: 100%; overflow: hidden; }
    .layer-card .card-h { padding: 0.85rem 1rem; font-weight: 700; border-bottom: 1px solid #2a2a2a; font-size: 0.95rem; }
    .layer-card .card-b { padding: 1rem; font-size: 0.9rem; }
    .tier1 .card-h { background: linear-gradient(90deg, #4c1d95 0%, #1e1b4b 100%); color: #e9d5ff; }
    .tier2 .card-h { background: linear-gradient(90deg, #14532d 0%, #052e16 100%); color: #bbf7d0; }
    .tier3 .card-h { background: linear-gradient(90deg, #450a0a 0%, #1c1917 100%); color: #fecaca; }
    .tier3.alert-hot { border-color: #dc2626; box-shadow: 0 0 0 1px #dc2626, 0 0 24px rgba(220,38,38,0.25); }
    .dir-buy { color: #f87171; font-weight: 700; }
    .dir-sell { color: #60a5fa; font-weight: 700; }
    .dir-neu { color: #94a3b8; font-weight: 600; }
    .chart-wrap { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 14px; padding: 1rem; }
    .chart-box { position: relative; height: min(420px, 55vh); width: 100%; }
    .events-panel { background: #111; border: 1px solid #2a2a2a; border-radius: 14px; padding: 1rem; height: 100%; min-height: 280px; }
    .events-panel h6 { color: #f1c40f; font-weight: 700; }
    .events-panel li { margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.9rem; }
    .meta-foot { font-size: 0.8rem; color: #6b7280; }
    a.back-link { color: #93c5fd; }
    .risk-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .risk-badge { font-size: 0.8rem; font-weight: 700; padding: 0.35rem 0.65rem; border-radius: 8px;
      background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #fecaca;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.35); animation: risk-pulse 2s ease-in-out infinite; }
    @keyframes risk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    .stock-switch { max-width: 200px; font-size: 0.95rem; }
    .url-hint { font-size: 0.75rem; color: #6b7280; }
    .arb-panel { background: #14100a; border: 1px solid #78350f; border-radius: 14px; padding: 1rem 1.15rem; }
    .arb-panel.high { border-color: #dc2626; background: linear-gradient(135deg, #1a0a0a 0%, #141414 100%); box-shadow: 0 0 20px rgba(220,38,38,0.15); }
    .arb-panel.mild { border-color: #ca8a04; }
    .arb-panel.aligned { border-color: #166534; }
    .conflict-meter { height: 8px; border-radius: 4px; background: #2a2a2a; overflow: hidden; }
    .conflict-meter > span { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #dc2626); transition: width 0.3s; }
    .hint-box { background: #111827; border-left: 3px solid #6366f1; padding: 0.65rem 0.85rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #c7d2fe; }
    .monitor-pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px; background: #1f2937; color: #fde68a; border: 1px solid #4b5563; }
    .tier3-heavy-banner { font-size: 0.85rem; font-weight: 700; color: #fecaca; background: rgba(220,38,38,0.25); border: 1px solid #dc2626; border-radius: 8px; padding: 0.5rem 0.65rem; margin-top: 0.5rem; animation: risk-pulse 2s ease-in-out infinite; }
    .score-trend-box { height: min(280px, 38vh); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <a class="back-link small" href="index.html">← 返回戰情室</a>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <label class="text-secondary small mb-0" for="stockSelect">切換</label>
          <select id="stockSelect" class="form-select form-select-sm bg-dark text-white border-secondary stock-switch" title="網址 ?stock=代號"></select>
          <span class="url-hint" id="urlHint"></span>
        </div>
        <span class="meta-foot" id="probeMeta"></span>
      </div>
      <div class="row align-items-center g-4">
        <div class="col-lg-8">
          <div class="d-flex flex-wrap align-items-baseline gap-3 mb-2">
            <span class="stock-title" id="stockTitle">載入中…</span>
            <span class="text-secondary" id="stockIdBadge"></span>
            <div id="riskBadges" class="risk-badges"></div>
          </div>
          <div class="d-flex flex-wrap align-items-end gap-4 mb-3">
            <div>
              <div class="chip-label">現價（收盤）</div>
              <div class="price-pill" id="closePrice">—</div>
            </div>
            <div>
              <div class="chip-label">籌碼分 chip_score</div>
              <div class="chip-num" id="chipScore">—</div>
            </div>
          </div>
          <p class="summary-lead mb-2" id="headlineSummary">載入 JSON…</p>
          <div id="actionRow"></div>
        </div>
        <div class="col-lg-4 text-center">
          <div class="chip-label mb-2">籌碼燈號</div>
          <div class="lights mb-2" id="trafficLights" aria-label="chip 燈號">
            <div class="light green" id="lightGreen" title="綠燈"></div>
            <div class="light yellow" id="lightYellow" title="黃燈"></div>
            <div class="light red" id="lightRed" title="紅燈"></div>
          </div>
          <div class="small text-secondary" id="chipComment"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div id="loadErr" class="alert alert-danger d-none" role="alert"></div>

    <div id="arbitrationPanel" class="arb-panel mb-4 d-none" role="region" aria-label="法人矛盾仲裁"></div>

    <div class="row g-3 mb-4">
      <div class="col-lg-7">
        <div class="hint-box" id="confidenceHint">信心度說明載入中…</div>
      </div>
      <div class="col-lg-5 d-flex flex-wrap align-items-center gap-2">
        <span class="text-secondary small">Monitor</span>
        <span class="monitor-pill" id="monitorState">—</span>
        <span class="text-secondary small" id="monitorReasons"></span>
      </div>
    </div>

    <h5 class="text-warning mb-2">籌碼／群聚走勢（近 20 日）</h5>
    <p class="meta-foot mb-2">完整 chip_score 歷史需多日回測；下圖以 coherence（群聚）與今日 chip_score 對照，輔助判斷 FADING 是否延續。</p>
    <div class="chart-wrap score-trend-box mb-4">
      <canvas id="trendChart"></canvas>
    </div>

    <h5 class="text-warning mb-3">大戶動向分層</h5>
    <div class="row g-3 mb-4" id="layerCards">
      <!-- filled by JS -->
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <h5 class="text-warning mb-2">Top6 累積買賣超（千張）</h5>
        <div class="chart-wrap chart-box mb-2">
          <canvas id="whaleChart"></canvas>
        </div>
        <p class="meta-foot mb-0">資料來源：whale_data 累積值 + history_labels；與主站分數儀表板相同邏輯。</p>
      </div>
      <div class="col-lg-4">
        <div class="events-panel">
          <h6 class="mb-3">關鍵事件</h6>
          <ul class="ps-3 mb-0" id="keyEventsList"><li class="text-secondary">載入中…</li></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DEFAULT_STOCK = '6239';
      var GRID_COLOR = 'rgba(255, 255, 255, 0.05)';
      var TICK_COLOR = '#d1d5db';
      var TIER3_HEAVY_LOT = 500;
      var INST_FLOW_EPS = 50;
      var manifestCache = null;
      var whaleChart = null;
      var trendChart = null;

      function getStockFromUrl() {
        var p = new URLSearchParams(window.location.search);
        var s = (p.get('stock') || DEFAULT_STOCK).trim();
        return /^[0-9A-Za-z]{4,6}$/.test(s) ? s : DEFAULT_STOCK;
      }

      function jsonUrl(stockId) {
        return 'data/' + encodeURIComponent(stockId) + '_whale_track.json';
      }

      const $ = function (id) { return document.getElementById(id); };

      function dirZh(d) {
        var x = String(d || '').toUpperCase();
        if (x === 'BUY') return '買超';
        if (x === 'SELL') return '賣超';
        if (x === 'STRONG_BUY') return '強買';
        if (x === 'STRONG_SELL') return '強賣';
        return x || '—';
      }

      function dirClass(d) {
        var x = String(d || '').toUpperCase();
        if (x.indexOf('BUY') >= 0) return 'dir-buy';
        if (x.indexOf('SELL') >= 0) return 'dir-sell';
        return 'dir-neu';
      }

      function pickClose(signals) {
        if (!signals) return null;
        var e = signals.enhanced;
        if (e && e.close_last != null && !isNaN(Number(e.close_last))) return Number(e.close_last);
        return null;
      }

      function flagOn(v) {
        return v === 1 || v === '1' || v === true;
      }

      function signFlowLot(v, eps) {
        eps = eps == null ? INST_FLOW_EPS : eps;
        if (v > eps) return 1;
        if (v < -eps) return -1;
        return 0;
      }

      function computeChipArbitration(sig, wl) {
        if (sig && sig.chip_arbitration) return sig.chip_arbitration;
        if (!sig || !wl) return null;
        var instLot = Math.round(Number(sig.inst_three_net_5d || 0) / 1000 * 10) / 10;
        var s1 = (wl.tier1_institutional && wl.tier1_institutional.layer_summary) || {};
        var s2 = (wl.tier2_local_major && wl.tier2_local_major.layer_summary) || {};
        var t1 = Number(s1.total_net_5d || 0);
        var t2 = Number(s2.total_net_5d || 0);
        var top6 = Math.round((t1 + t2) * 10) / 10;
        var si = signFlowLot(instLot);
        var st = signFlowLot(top6);
        var s2d = signFlowLot(t2);
        var conflict = si !== 0 && st !== 0 && si !== st;
        var maxMag = Math.max(Math.abs(instLot), Math.abs(top6));
        var mag = conflict ? Math.min(Math.abs(instLot), Math.abs(top6)) : 0;
        var level, index, verdict, trustHint = '';
        if (!conflict) {
          level = 'ALIGNED';
          index = Math.max(0, Math.round(12 - Math.min(12, Math.abs(instLot - top6) / 80)));
          verdict = '三大法人與分點大戶五日方向大致一致，籌碼歸屬較清楚。';
        } else if (maxMag < 300) {
          level = 'MILD';
          index = 35 + Math.min(25, Math.round(mag / 12));
          verdict = '法人與分點方向略有分歧，宜觀察哪一邊量能延續。';
        } else {
          level = 'HIGH';
          index = Math.min(100, 55 + Math.min(45, Math.round(mag / 18 + maxMag / 45)));
          verdict = '三大法人 vs 分點大戶方向相反，籌碼歸屬不明，風險偏高；不宜單邊重押，以觀望或減碼為宜。';
          if (si < 0 && s2d > 0) {
            trustHint = '法人持續賣超、本土 Top6 接盤：中長期宜偏法人；短線勿假設本土能永遠撐盤。';
          } else if (si > 0 && s2d < 0) {
            trustHint = '法人買、分點賣：留意分點倒貨是否抵銷法人買盤。';
          } else {
            trustHint = '方向矛盾時，優先參考三大法人＋借券／融資旗標。';
          }
        }
        return {
          inst_three_net_5d_lot: instLot,
          top6_net_5d_lot: top6,
          tier1_net_5d_lot: Math.round(t1 * 10) / 10,
          tier2_net_5d_lot: Math.round(t2 * 10) / 10,
          conflict_level: level,
          conflict_index: index,
          verdict: verdict,
          detail: '三大法人 5日約 ' + instLot.toFixed(0) + ' 千張；Top6 外資 ' + t1.toFixed(0) + '、本土 ' + t2.toFixed(0) + ' 千張',
          trust_hint: trustHint
        };
      }

      function confidenceHintText(hl, sig, arb) {
        if (hl && hl.confidence_hint) return hl.confidence_hint;
        var conf = hl && hl.confidence != null ? Number(hl.confidence) : Number(sig.chip_score || 50);
        var f5 = Number(sig.foreign_net_5d || 0);
        var l5 = Number(sig.local_net_5d || 0);
        var diverge = (f5 > 0 && l5 < 0) || (f5 < 0 && l5 > 0);
        var parts = [];
        if (conf < 45) parts.push('信心偏低：多項訊號相互矛盾，不宜重押或追高。');
        if (arb && arb.conflict_level === 'HIGH') parts.push(arb.verdict);
        if (diverge) parts.push('外資／本土 Top6 五日方向亦相反。');
        var mon = String(sig.monitor_state || '').toUpperCase();
        if (mon === 'FADING') parts.push('Monitor FADING：群聚走弱，請搭配下方走勢圖判斷是否延續。');
        if (mon === 'DISTRIBUTION') parts.push('DISTRIBUTION：留意倒貨。');
        return parts.length ? parts.join(' ') : '信心中等：維持標準部位與停損紀律。';
      }

      function monitorStateZh(st) {
        var m = {
          FADING: '退潮 FADING',
          DISTRIBUTION: '出貨 DISTRIBUTION',
          ACCUMULATION: '吸籌 ACCUMULATION',
          MARKUP: '拉升 MARKUP',
          NEUTRAL: '中性 NEUTRAL'
        };
        return m[String(st || '').toUpperCase()] || st || '—';
      }

      function renderArbitrationPanel(arb) {
        var panel = $('arbitrationPanel');
        if (!panel) return;
        if (!arb) { panel.classList.add('d-none'); return; }
        panel.classList.remove('d-none');
        panel.classList.remove('high', 'mild', 'aligned');
        var lv = String(arb.conflict_level || '').toLowerCase();
        if (lv === 'high') panel.classList.add('high');
        else if (lv === 'mild') panel.classList.add('mild');
        else panel.classList.add('aligned');
        var idx = Number(arb.conflict_index || 0);
        var trust = arb.trust_hint ? '<p class="small text-warning mb-0 mt-2">' + arb.trust_hint + '</p>' : '';
        panel.innerHTML =
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">' +
          '<h6 class="text-warning mb-0">📛 法人矛盾仲裁</h6>' +
          '<span class="badge bg-' + (lv === 'high' ? 'danger' : (lv === 'mild' ? 'warning text-dark' : 'success')) + '">' +
          '矛盾指數 ' + idx + ' · ' + (arb.conflict_level || '') + '</span></div>' +
          '<p class="mb-2">' + (arb.verdict || '') + '</p>' +
          '<p class="small text-secondary mb-2">' + (arb.detail || '') + '</p>' +
          '<div class="conflict-meter" title="越高代表三大法人與分點大戶越不一致"><span style="width:' + Math.min(100, idx) + '%"></span></div>' +
          trust;
      }

      function renderMonitorRow(sig) {
        var st = $('monitorState');
        var rs = $('monitorReasons');
        if (st) st.textContent = monitorStateZh(sig.monitor_state);
        if (rs) {
          var reasons = sig.monitor_reasons;
          rs.textContent = Array.isArray(reasons) && reasons.length
            ? '（' + reasons.join(' · ') + '）'
            : '';
        }
      }

      function tier3HeavyFromWl(wl) {
        var mem = (wl && wl.tier3_day_trader && wl.tier3_day_trader.members) || [];
        var heavy = (wl && wl.tier3_day_trader && wl.tier3_day_trader.heavy_alerts) || [];
        if (heavy.length) return heavy;
        return mem.filter(function (m) {
          return Math.abs(Number(m.net_5d_lot || 0)) >= TIER3_HEAVY_LOT;
        }).map(function (m) {
          var n = Number(m.net_5d_lot || 0);
          return { name: m.name, net_5d_lot: n, side: n < 0 ? 'SELL' : 'BUY' };
        }).sort(function (a, b) {
          return Math.abs(b.net_5d_lot) - Math.abs(a.net_5d_lot);
        });
      }

      function renderRiskBadges(signals) {
        var host = $('riskBadges');
        if (!host) return;
        host.innerHTML = '';
        if (!signals) return;
        if (flagOn(signals.sbl_short_pressure_flag)) {
          var b1 = document.createElement('span');
          b1.className = 'risk-badge';
          b1.textContent = '\uD83D\uDEA8 借券異常激增';
          host.appendChild(b1);
        }
        if (flagOn(signals.margin_risk_flag)) {
          var b2 = document.createElement('span');
          b2.className = 'risk-badge';
          b2.textContent = '\uD83D\uDEA8 融資斷頭風險';
          host.appendChild(b2);
        }
      }

      function populateStockSelect(manifest, currentId) {
        var sel = $('stockSelect');
        if (!sel) return;
        sel.innerHTML = '';
        var list = [];
        if (manifest && manifest.stocks && manifest.stocks.length) {
          list = manifest.stocks.slice();
        } else if (manifest && manifest.stock_ids && manifest.stock_ids.length) {
          list = manifest.stock_ids.map(function (id) { return { id: id, name: id }; });
        } else {
          list = [{ id: currentId, name: currentId }];
        }
        list.forEach(function (s) {
          var id = String(s.id || s).trim();
          if (!id) return;
          var opt = document.createElement('option');
          opt.value = id;
          opt.textContent = (s.name ? s.name + ' (' + id + ')' : id);
          if (id === currentId) opt.selected = true;
          sel.appendChild(opt);
        });
        if (!sel.querySelector('option[value="' + currentId + '"]')) {
          var o = document.createElement('option');
          o.value = currentId;
          o.textContent = currentId;
          o.selected = true;
          sel.insertBefore(o, sel.firstChild);
        }
      }

      function navigateToStock(stockId) {
        var url = new URL(window.location.href);
        url.searchParams.set('stock', stockId);
        window.location.href = url.pathname + '?' + url.searchParams.toString();
      }

      function setLights(light) {
        var g = $('lightGreen'), y = $('lightYellow'), r = $('lightRed');
        [g, y, r].forEach(function (el) { el.classList.remove('on'); });
        var k = String(light || '').toLowerCase();
        if (k === 'green') g.classList.add('on');
        else if (k === 'yellow') y.classList.add('on');
        else r.classList.add('on');
      }

      function formatCostRange(arr) {
        if (!arr || arr.length < 2) return '—';
        var a = Number(arr[0]), b = Number(arr[1]);
        if (isNaN(a) || isNaN(b)) return '—';
        var lo = Math.min(a, b), hi = Math.max(a, b);
        return lo.toFixed(2) + ' ~ ' + hi.toFixed(2);
      }

      function confluenceLine(wl) {
        if (!wl) return '';
        var s1 = wl.tier1_institutional && wl.tier1_institutional.layer_summary;
        var s2 = wl.tier2_local_major && wl.tier2_local_major.layer_summary;
        if (!s1 || !s2) return '';
        var d1 = String(s1.direction || '').toUpperCase();
        var d2 = String(s2.direction || '').toUpperCase();
        var same = (d1.indexOf('BUY') >= 0 && d2.indexOf('BUY') >= 0) || (d1.indexOf('SELL') >= 0 && d2.indexOf('SELL') >= 0);
        var div = (d1.indexOf('BUY') >= 0 && d2.indexOf('SELL') >= 0) || (d1.indexOf('SELL') >= 0 && d2.indexOf('BUY') >= 0);
        if (same) return '<span class="text-success">外資與本土五日方向同向</span>';
        if (div) return '<span class="text-warning">外資與本土五日方向分歧（Confluence 未成立）</span>';
        return '<span class="text-secondary">外資／本土方向中性混搭</span>';
      }

      function buildLayerCards(wl) {
        var host = $('layerCards');
        host.innerHTML = '';
        if (!wl) return;

        function cardHtml(tierKey, tierCls, shortTag) {
          var T = wl[tierKey] || {};
          var label = T.label || tierKey;
          var mem = T.members || [];
          var sum = T.layer_summary || {};
          var alertTxt = T.alert || '';
          var isT3 = tierKey === 'tier3_day_trader';
          var heavyT3 = isT3 ? tier3HeavyFromWl(wl) : [];
          var hot = isT3 && (mem.length > 0 || heavyT3.length > 0);
          var net = '—';
          if (sum.total_net_5d != null) {
            net = Number(sum.total_net_5d).toFixed(1);
          } else if (isT3 && mem.length) {
            var t = 0;
            mem.forEach(function (m) { t += Number(m.net_5d_lot || 0); });
            net = t.toFixed(1);
          }
          var dir = sum.direction;
          var cr = formatCostRange(sum.avg_cost_range);
          var extra = '';
          if (tierKey === 'tier2_local_major') {
            extra = '<div class="mt-2 small">' + confluenceLine(wl) + '</div>';
          }
          if (isT3) {
            extra += '<div class="mt-2 small text-danger-emphasis">' + (alertTxt || (mem.length ? '短線／隔日沖特徵' : '')) + '</div>';
            if (heavyT3.length) {
              heavyT3.forEach(function (h) {
                var n = Number(h.net_5d_lot || 0);
                var side = String(h.side || '').toUpperCase() === 'SELL' ? '賣超' : '買超';
                extra += '<div class="tier3-heavy-banner">\uD83D\uDEA8 重倉警示：' + (h.name || '分點') +
                  ' 五日淨' + side + Math.abs(n).toFixed(0) + ' 張（\u2265' + TIER3_HEAVY_LOT + ' 張門檻）</div>';
              });
            }
          }
          var body = '<div class="mb-1">五日淨額：<strong>' + net + '</strong> 千張</div>';
          if (!isT3) {
            body += '<div class="mb-1">方向：<span class="' + dirClass(dir) + '">' + dirZh(dir) + '</span>';
            if (sum.consensus) body += ' <span class="text-secondary">(' + sum.consensus + ')</span>';
            body += '</div>';
            body += '<div class="mb-1">大戶成本區間：<strong>' + cr + '</strong></div>';
          } else {
            body += '<div class="mb-1 text-secondary small">此層為短線／隔日沖偵測，無單一「成本區間」彙總。</div>';
          }
          body += '<div class="small text-secondary mt-2">分點數：' + mem.length + '</div>';
          body += extra;
          var wrap = document.createElement('div');
          wrap.className = 'col-md-4';
          wrap.innerHTML =
            '<div class="layer-card ' + tierCls + (hot ? ' tier3 alert-hot' : '') + '">' +
            '<div class="card-h">' + shortTag + ' ' + label + '</div>' +
            '<div class="card-b">' + body + '</div></div>';
          return wrap;
        }

        host.appendChild(cardHtml('tier1_institutional', 'tier1', '[外資]'));
        host.appendChild(cardHtml('tier2_local_major', 'tier2', '[本土]'));
        host.appendChild(cardHtml('tier3_day_trader', 'tier3', '[短線]'));
      }

      function fillKeyEvents(headline) {
        var ul = $('keyEventsList');
        ul.innerHTML = '';
        var ev = headline && headline.key_events ? headline.key_events : [];
        if (!ev.length) {
          ul.innerHTML = '<li class="text-secondary">無 key_events</li>';
          return;
        }
        ev.forEach(function (t) {
          var li = document.createElement('li');
          li.textContent = t;
          ul.appendChild(li);
        });
      }


      function drawTrendChart(sig) {
        var ctx = $('trendChart');
        if (!ctx) return;
        if (trendChart) { trendChart.destroy(); trendChart = null; }
        var labels = (sig.labels_20d || []).slice();
        var enh = sig.enhanced || {};
        var coh = (enh.coherence_series_20d || []).map(Number);
        if (!labels.length || !coh.length) return;
        var chip = sig.chip_score != null ? Number(sig.chip_score) : null;
        var cohScaled = coh.map(function (v) { return Math.round(v * 50 * 10) / 10; });
        var chipLine = chip != null ? labels.map(function (_, i) {
          return i === labels.length - 1 ? chip : null;
        }) : [];
        var datasets = [{
          label: '群聚指標×50（代理走勢）',
          data: cohScaled,
          borderColor: '#a78bfa',
          backgroundColor: 'rgba(167,139,250,0.12)',
          fill: true,
          tension: 0.3,
          borderWidth: 2,
          pointRadius: 2
        }];
        if (chip != null) {
          datasets.push({
            label: '今日 chip_score',
            data: chipLine,
            borderColor: '#38bdf8',
            borderWidth: 2,
            borderDash: [6, 4],
            pointRadius: 5,
            pointBackgroundColor: '#38bdf8',
            spanGaps: false
          });
        }
        trendChart = new Chart(ctx, {
          type: 'line',
          data: { labels: labels, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#e5e7eb' } },
              title: {
                display: true,
                text: '近20日群聚走勢（紫）＋今日籌碼分（藍點）',
                color: '#f1c40f',
                font: { size: 13 }
              }
            },
            scales: {
              x: { ticks: { color: TICK_COLOR }, grid: { color: GRID_COLOR } },
              y: {
                min: 0,
                max: 100,
                ticks: { color: TICK_COLOR },
                grid: { color: GRID_COLOR },
                title: { display: true, text: '0–100', color: '#9ca3af' }
              }
            }
          }
        });
      }

      function drawChart(payload) {
        var ctx = $('whaleChart');
        if (!ctx || !payload.whale_data || !payload.history_labels) return;
        if (whaleChart) { whaleChart.destroy(); whaleChart = null; }
        var labels = payload.history_labels.slice();
        var ds = (payload.whale_data || []).map(function (w) {
          return {
            label: w.name,
            data: (w.values || []).map(Number),
            borderColor: w.color || '#888',
            backgroundColor: 'transparent',
            tension: 0.25,
            borderWidth: 2,
            pointRadius: 2
          };
        });
        whaleChart = new Chart(ctx, {
          type: 'line',
          data: { labels: labels, datasets: ds },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#e5e7eb', font: { family: "'Segoe UI', 'Microsoft JhengHei', sans-serif" } } },
              title: { display: true, text: 'Top6 大戶累積買賣超（千張）', color: '#f1c40f', font: { size: 14 } },
              tooltip: { titleColor: '#f9fafb', bodyColor: '#e5e7eb', backgroundColor: 'rgba(20,20,20,0.95)' }
            },
            scales: {
              x: {
                ticks: { color: TICK_COLOR },
                grid: { color: GRID_COLOR },
                border: { color: 'rgba(255,255,255,0.12)' }
              },
              y: {
                ticks: { color: TICK_COLOR },
                grid: { color: GRID_COLOR },
                border: { color: 'rgba(255,255,255,0.12)' }
              }
            }
          }
        });
      }

      function badgeForAction(sig) {
        var s = String(sig || '').toUpperCase();
        var map = {
          'BUY_ZONE': ['success', 'BUY_ZONE'],
          'HOLD_WATCH': ['warning', 'HOLD_WATCH'],
          'EXIT_ALERT': ['danger', 'EXIT_ALERT'],
          'NEUTRAL': ['secondary', 'NEUTRAL']
        };
        var m = map[s] || ['info', s || '—'];
        return '<span class="badge bg-' + m[0] + ' signal-badge">' + m[1] + '</span>';
      }

      function renderDashboard(data, stock, manifest) {
        var name = data.stock_name || stock;
        if (manifest && manifest.stocks && Array.isArray(manifest.stocks)) {
          var hit = manifest.stocks.find(function (s) { return String(s.id) === String(stock); });
          if (hit && hit.name) name = hit.name;
        }
        document.title = name + ' (' + stock + ') | Phase 2 一眼看盤';
        $('stockTitle').textContent = name;
        $('stockIdBadge').textContent = '(' + stock + ')';
        var hint = $('urlHint');
        if (hint) hint.textContent = '?stock=' + stock;

        var sig = data.signals || {};
        $('chipScore').textContent = sig.chip_score != null ? Number(sig.chip_score).toFixed(1) : '—';
        setLights(sig.chip_light);
        $('chipComment').textContent = sig.chip_comment || '';
        renderRiskBadges(sig);

        var cl = pickClose(sig);
        $('closePrice').textContent = cl != null ? cl.toFixed(2) : '—';

        var hl = data.headline || {};
        $('headlineSummary').textContent = hl.summary || '（無 headline.summary）';
        var ar = $('actionRow');
        ar.innerHTML = '<span class="me-2 text-secondary small">行動訊號</span> ' + badgeForAction(hl.action_signal) +
          ' <span class="text-secondary small ms-2">信心 ' + (hl.confidence != null ? hl.confidence : '—') + '</span>';

        $('probeMeta').textContent = 'probe: ' + (data.probe_date || '—') + ' ｜ 更新: ' + (data.last_update || '—');

        var wl = data.whale_layers || {};
        var arb = computeChipArbitration(sig, wl);
        renderArbitrationPanel(arb);
        var hintEl = $('confidenceHint');
        if (hintEl) hintEl.textContent = confidenceHintText(hl, sig, arb);
        renderMonitorRow(sig);
        buildLayerCards(wl);
        fillKeyEvents(hl);
        drawTrendChart(sig);
        drawChart(data);
        var err = $('loadErr');
        if (err) err.classList.add('d-none');
      }

      function loadStock(stockId) {
        stockId = String(stockId || DEFAULT_STOCK).trim();
        $('stockTitle').textContent = '載入中…';
        $('headlineSummary').textContent = '讀取 ' + jsonUrl(stockId) + ' …';

        var manifestPromise = manifestCache
          ? Promise.resolve(manifestCache)
          : fetch('data/manifest.json').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });

        return manifestPromise.then(function (manifest) {
          manifestCache = manifest;
          populateStockSelect(manifest, stockId);
          return fetch(jsonUrl(stockId)).then(function (r) {
            if (!r.ok) throw new Error('找不到 ' + jsonUrl(stockId) + '（HTTP ' + r.status + '）');
            return r.json();
          }).then(function (data) {
            renderDashboard(data, stockId, manifest);
          });
        });
      }

      var stock = getStockFromUrl();
      var sel = $('stockSelect');
      if (sel) {
        sel.addEventListener('change', function () {
          if (sel.value && sel.value !== stock) navigateToStock(sel.value);
        });
      }

      loadStock(stock).catch(function (e) {
        var el = $('loadErr');
        el.classList.remove('d-none');
        el.textContent = String(e.message || e);
        $('stockTitle').textContent = '載入失敗';
        $('headlineSummary').textContent = '';
        renderRiskBadges(null);
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
