# 自訂 GitHub Pages：只打包儀表板需要的檔案（排除 data/cache 等大檔）
# Settings → Pages → Build and deployment 選「GitHub Actions」時，請選此 workflow。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (no data/cache — 僅 dashboard 所需)
        run: |
          set -e
          mkdir -p _site/data
          for f in index.html dashboard.html Version.txt .nojekyll; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d data ]; then
            cp -r data/. _site/data/
            rm -rf _site/data/cache
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
