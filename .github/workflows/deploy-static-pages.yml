# 自訂 GitHub Pages：build 上傳 artifact → deploy 部署（deploy-pages 不可與 upload 同 job）
# https://github.com/actions/deploy-pages#usage
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (no data/cache)
        run: |
          set -e
          mkdir -p _site/data
          for f in index.html dashboard.html Version.txt .nojekyll; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d data ]; then
            cp -r data/. _site/data/
            rm -rf _site/data/cache
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
