# 僅在 Settings → Pages 選「GitHub Actions」時使用。
# deploy-pages 必須獨立 job（needs: build），不可與 upload-pages-artifact 同 job。
# 若 Pages 已設為「Deploy from a branch」：保持下方 push 註解，只用手動 Run workflow，避免與內建 pages-build-deployment 重複。
# 若 Pages 改為「GitHub Actions」且要走本 workflow：取消 push 註解。
name: Deploy static site to Pages

on:
  workflow_dispatch:
# push:
#   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site（不整包複製 data/）
        run: |
          set -e
          mkdir -p _site/data

          for f in index.html dashboard.html Version.txt .nojekyll; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done

          if [ -f data/manifest.json ]; then
            cp data/manifest.json _site/data/
          fi

          find data -maxdepth 1 -type f \( \
            -name '*_whale_track.json' -o \
            -name '*_top6_history.json' -o \
            -name '*_metric_history.json' -o \
            -name '*_signals_history.json' \
          \) -exec cp -t _site/data {} +

          for f in \
            cross_stock_flow.json \
            market_context.json \
            signal_stats.json \
            signal_history.json \
            cross_flow_history.json \
            inst_daily_history.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" _site/data/
            fi
          done

          if [ -f data/signal_vs_returns_report.html ]; then
            cp data/signal_vs_returns_report.html _site/data/
          fi

          shopt -s nullglob
          for f in data/ml_winrate_report_ret*.html; do
            cp "$f" _site/data/
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
